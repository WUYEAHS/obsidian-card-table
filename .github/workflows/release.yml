name: Release

# 推一個「純版本號」的 tag 就會發版(1.4.2,不是 v1.4.2)。
# Obsidian 是照 manifest.json 的 version 去找同名 tag 的 release,
# 多一個 v 就找不到 —— 所以下面的 pattern 故意不吃 v 開頭。
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

# attestations 需要這三個:contents 寫 release、id-token 簽章、attestations 寫存證
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tag 跟 manifest 對不起來的話,使用者裝到的會是另一版 —— 在這裡擋掉最便宜
      - name: Check tag matches manifest.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(jq -r .version manifest.json)"
          echo "tag=$TAG  manifest=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag ($TAG) does not match manifest.json version ($VERSION)"
            exit 1
          fi
          if ! jq -e --arg v "$VERSION" 'has($v)' versions.json > /dev/null; then
            echo "::error::versions.json has no entry for $VERSION"
            exit 1
          fi

      # 審核建議的那一項:讓使用者可以驗證這三個檔案真的是從這個 repo 出來的
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # release 沒有說明的話,使用者在更新清單上只看得到一個版本號。
      # 從 CHANGELOG.md 撈這一版那一段;撈不到就退回 GitHub 自動產生的。
      - name: Build release notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ -f CHANGELOG.md ] && grep -q "^## $VERSION\$" CHANGELOG.md; then
            awk -v v="## $VERSION" '
              $0 == v { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' CHANGELOG.md > RELEASE_NOTES.md
          fi
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "no CHANGELOG entry for $VERSION - falling back to generated notes"
            rm -f RELEASE_NOTES.md
          fi

      # ⚠ 一定要三個**獨立附件**。GitHub 自動附的 source zip 不算,
      #   Obsidian 不會去解壓縮。
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # 已經建好的 release:只有撈得到說明才去改它,
            # ⚠ 不要對 edit 用 --generate-notes,舊版 gh 沒有這個旗標。
            if [ -f RELEASE_NOTES.md ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
            fi
            gh release upload "$GITHUB_REF_NAME" \
              main.js manifest.json styles.css --clobber
            # 審核會把「多出來的附件」列成建議事項(1.4.3 就多了 README.md、CHANGELOG.md,
            # 是在網頁上手動建 release 時一起拖進去的)。Obsidian 只會下載這三個,其他的一律拿掉。
            gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | while read -r NAME; do
              case "$NAME" in
                main.js|manifest.json|styles.css) ;;
                *) echo "removing extra asset: $NAME"; gh release delete-asset "$GITHUB_REF_NAME" "$NAME" -y ;;
              esac
            done
          elif [ -f RELEASE_NOTES.md ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md \
              main.js manifest.json styles.css
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              main.js manifest.json styles.css
          fi
